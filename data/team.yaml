# required: name, description
# optional: suffix, photo, joined, focus, fun_fact
# photo defaults to the file in assets/photos/ that carries the member name,
# with the extension jpg, jpeg, png, or webp. Set photo only for an exception,
# as a path under assets/, for example photos/group/lin-2019.png
# optional, each one adds an icon link to the card: orcid, github, x, email, phone, cv, website
# orcid takes the bare identifier, for example 0000-0002-1825-0097
# github and x take the bare handle, without the @
# cv takes a path under static/, without the static/ prefix, for example assets/cv/najac.pdf
# bio names a fragment in content/. It replaces description, for a longer text.
# wide, on a group, gives its cards the full width with the photo beside the text.
# Groups render in the order below. Members render in alphabetical order.
- group: Principal Investigator
  wide: true
  members:
    - name: Teresa Palomero
      suffix: PhD
      bio: teresa
      x: teresa_palomero
      cv: assets/cv/TeresaPalomero-CV.pdf

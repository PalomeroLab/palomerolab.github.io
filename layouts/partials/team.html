<div class="container mx-auto">
  <div class="col-lg-10 mx-auto">
    <h2>Meet the Palomero Team</h2>
    <br />
    <div id="dynamic-people-section">
      <!-- Team roster (data/team.yaml), grouped by role -->
      {{ range site.Data.team }}
      {{ if .members }}
      <div class="mb-5">
        <h3>{{ .group }}</h3>
        <div class="row">
          {{ $wide := .wide }}
          {{ range sort .members "name" }}
          {{ partial "person-card.html" (dict "member" . "wide" $wide) }}
          {{ end }}
        </div>
      </div>
      {{ end }}
      {{ end }}
    </div>
  </div>
</div>

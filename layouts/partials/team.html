<!-- Section: People -->
<section id="people" class="bg-light py-5">
  <div class="container mx-auto">
    <div class="col-lg-10 mx-auto">
      <h2>Meet the Palomero Team</h2>
      <br />
      <!-- Teresa Card -->
      <div class="row">
        <div class="card mx-2">
          <div class="row">
            <div class="col-auto">
              <img src='{{ "assets/photos/TeresaPalomero.jpg" | relURL }}' class="card-img-top" alt="Dr. Teresa Palomero" />
            </div>
            <div class="col">
              <div class="card-body">
                <!-- Bio (rendered from content/teresa.md) -->
                <div class="card-text" id="teresa-bio">{{ with site.GetPage "teresa" }}{{ .Content }}{{ end }}</div>
              </div>
            </div>
          </div>
        </div>
        <br />
      </div>
      <br />
      <div id="dynamic-people-section">
        <!-- Team roster (data/team.yaml), grouped by role -->
        {{ range site.Data.team }}
        {{ if .members }}
        <div class="mb-5">
          <h3>{{ .group }}</h3>
          <div class="row">
            {{ range .members }}
            <div class="col-sm-4 mx-0 px-2">
              <div class="card">
                <img src="{{ .photo | relURL }}" class="card-img-top" alt="{{ .name }}" />
                <div class="card-body">
                  <p class="card-title"><strong>{{ .name }}</strong></p>
                  <p class="card-text">{{ .description }}</p>
                  {{ with .website }}<a class="card-link" href="{{ . }}" target="_blank" rel="noopener" aria-label="Website"
                    ><i class="fa-solid fa-arrow-up-right-from-square"></i></a
                  >{{ end }}
                </div>
              </div>
            </div>
            {{ end }}
          </div>
        </div>
        {{ end }}
        {{ end }}
      </div>
    </div>
  </div>
</section>

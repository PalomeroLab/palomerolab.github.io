<!-- Navbar. A section anchor works on the home page. Another page needs the
home page in front of it, because the section is not there to scroll to. -->
{{ $prefix := cond .IsHome "" (relURL "/") }}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" id="mainNav">
  <div class="container mx-auto">
    <a class="navbar-brand" href="{{ $prefix }}#page-top">Palomero Lab</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarResponsive"
      aria-controls="navbarResponsive"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ms-auto">
        {{ range site.Menus.main }}
        <li class="nav-item">
          <a class="nav-link" href="{{ if hasPrefix .URL "#" }}{{ $prefix }}{{ .URL }}{{ else }}{{ .URL | relURL }}{{ end }}">{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </div>
  </div>
</nav>

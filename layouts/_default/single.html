<!doctype html>
<html lang="en" itemscope itemtype="https://schema.org/WebPage">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Ryan D. Najac" />
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="{{ .Description | default site.Params.description }}" />

    <title>{{ .Title }} | {{ site.Title }}</title>

    <link rel="canonical" href="{{ .Permalink }}" />
    <link rel="icon" type="image/x-icon" href='{{ "assets/favicon.png" | relURL }}' />

    {{ template "_internal/opengraph.html" . }}
    {{ template "_internal/twitter_cards.html" . }}
    {{ template "_internal/schema.html" . }}

    <!-- Stylesheets -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@latest/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-scrolling-nav@5.0.6/dist/css/styles.min.css" rel="stylesheet" />
    <link href='{{ "assets/css/styles.css" | relURL }}' rel="stylesheet" />
  </head>
  <body id="page-top">
    {{ partial "navbar.html" . }}
    <section class="py-5 mt-5">
      <div class="container mx-auto">
        <div class="row">
          <div class="col-lg-10 mx-auto">{{ .Content }}</div>
        </div>
      </div>
    </section>
    {{ partial "footer.html" . }}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

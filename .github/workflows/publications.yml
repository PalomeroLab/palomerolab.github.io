name: Refresh publications

# The site renders the publication list from data/publications.json at build
# time. This workflow refreshes that file every Monday. A site build never calls
# PubMed, so a PubMed outage cannot break a deploy.

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch publications
        run: python3 scripts/fetch-publications.py

      - name: Commit the new records
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh the publication list from PubMed" -- data/publications.json
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push that uses GITHUB_TOKEN does not start another workflow, so the
      # deploy needs an explicit call.
      - name: Deploy the new list
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hugo.yml --ref main

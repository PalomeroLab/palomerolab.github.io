baseURL = "https://www.palomerolab.org/"
locale = "en-us"
title = "Palomero Lab"
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "T-cell malignancies molecular genetics group"
  phone = "(212) 851-5292"
  address = ["Irving Cancer Research Center", "Columbia University Irving Medical Center", "1130 Saint Nicholas Ave, Room 607", "New York, NY 10032"]

# Page sections, in render order. Each entry drives one partial and one navbar
# link. To reorder the page, move an entry. Fields:
#   partial: layouts/partials/<partial>.html
#   id:      the section id used by the navbar anchor (defaults to partial)
#   name:    navbar label (omit to render the section without a navbar link)
# Background shading alternates automatically, based on position in this list.
[[params.sections]]
  partial = "about"
  name = "About"

[[params.sections]]
  partial = "research"
  name = "Research"

[[params.sections]]
  partial = "team"
  id = "people"
  name = "People"

[[params.sections]]
  partial = "publications"
  name = "Publications"

[[params.sections]]
  partial = "projects"
  name = "Projects"

[[params.sections]]
  partial = "join"
  name = "Join Us"

[[params.sections]]
  partial = "extras"
  name = "Extras"

[[params.sections]]
  partial = "contact"
  name = "Contact"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = false

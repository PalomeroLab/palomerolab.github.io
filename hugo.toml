baseURL = "https://www.palomerolab.org/"
locale = "en-us"
title = "Palomero Lab"
disableKinds = ["taxonomy", "term"]

[params]
  tagline = "T-cell malignancies molecular genetics group"
  phone = "(212) 851-5292"
  address = ["Irving Cancer Research Center", "Columbia University Irving Medical Center", "1130 Saint Nicholas Ave, Room 607", "New York, NY 10032"]

# The menu is the list of sections, in render order. Each entry gives one
# navbar link and one section on the page. The url names the section: "#people"
# renders layouts/partials/people.html inside <section id="people">. To add a
# section, write the partial and add an entry here. To reorder the page, change
# the weights. Background shading alternates automatically.
[[menus.main]]
  name = "About"
  url = "#about"
  weight = 1

# A url that does not start with "#" links to a page of its own. The home page
# skips it.
[[menus.main]]
  name = "Research"
  url = "/research/"
  weight = 2

[[menus.main]]
  name = "People"
  url = "#people"
  weight = 3

[[menus.main]]
  name = "Publications"
  url = "#publications"
  weight = 4

[[menus.main]]
  name = "Projects"
  url = "#projects"
  weight = 5

[[menus.main]]
  name = "Join Us"
  url = "#join"
  weight = 6

[[menus.main]]
  name = "Extras"
  url = "#extras"
  weight = 7

[[menus.main]]
  name = "Contact"
  url = "#contact"
  weight = 8

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = false
